services:
  isla-lp:
    build:
      context: .
      dockerfile: Dockerfile
    image: isla-lp-benchmark:latest
    container_name: isla-lp
    volumes:
      - ./data:/app/data:ro
      - ./output:/app/output
    environment:
      - GRB_LICENSE_FILE=/app/gurobi.lic
    command: --help

  solve:
    build: .
    volumes:
      - ./data:/app/data:ro
      - ./output:/app/output
    environment:
      - GRB_LICENSE_FILE=/app/gurobi.lic
    command: data/problem.txt

  benchmark:
    build: .
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    environment:
      - GRB_LICENSE_FILE=/app/gurobi.lic
    command: --benchmark --solvers highs glpk cbc --repetitions 3 data/problem.txt

  list-solvers:
    build: .
    command: --list-solvers