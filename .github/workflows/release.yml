name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$GITHUB_REF#refs/tags/" >> $GITHUB_OUTPUT

      - name: Validate version format
        run: |
          VERSION=${{ steps.version.outputs.version }}
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version invalida: $VERSION (debe ser SemVer: X.Y.Z)"
            exit 1
          fi
          echo "Version valida: $VERSION"

      - name: Verify version matches pyproject.toml
        run: |
          EXPECTED_VERSION=${{ steps.version.outputs.version }}
          ACTUAL_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "$EXPECTED_VERSION" != "$ACTUAL_VERSION" ]]; then
            echo "Error: Tag version ($EXPECTED_VERSION) no coincide con pyproject.toml ($ACTUAL_VERSION)"
            exit 1
          fi
          echo "Tag y pyproject.toml sincronizados: $ACTUAL_VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -z "$PREVIOUS_TAG" ]]; then
            RAW_LOG=$(git log --pretty=format:"- %h: %s" --grep="^[a-z]*(" -i -E)
          else
            RAW_LOG=$(git log "$PREVIOUS_TAG"..HEAD --pretty=format:"- %h: %s" --grep="^[a-z]*(" -i -E)
          fi
          CHANGELOG="${RAW_LOG//$'\n'/'%0A'}"
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: "Release v${{ steps.version.outputs.version }}"
          body: |
            # Release v${{ steps.version.outputs.version }}

            ## Changes
            ${{ steps.changelog.outputs.changelog || 'Sin cambios registrados' }}

            ---
            **Version:** v${{ steps.version.outputs.version }}
            **Released:** ${{ github.event.head_commit.timestamp }}
            **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          draft: false
          prerelease: false

      - name: Publish to PyPI (optional)
        if: ${{ vars.PUBLISH_TO_PYPI == 'true' }}
        run: |
          pip install build twine
          python -m build
          twine upload dist/*

      - name: Success notification
        if: success()
        run: |
          echo "Release v${{ steps.version.outputs.version }} creado exitosamente"
          echo ""
          echo "  Informacion del release:"
          echo "  - Version: v${{ steps.version.outputs.version }}"
          echo "  - Commit: ${{ github.sha }}"
          echo "  - URL: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}"
