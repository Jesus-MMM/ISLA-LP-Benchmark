[project]
name = "isla-lp-benchmark"
version = "1.8.2"
description = "LP Benchmarking Platform - Compare multiple Linear Programming solvers"
authors = [
    {name = "Oyhs-co", email = "oyhsotelo@gmail.com"}
]
license = {text = "MIT License"}
readme = "README.md"
requires-python = ">=3.12,<4"

# NÚCLEO: Solo lo indispensable para parsear y usar el solver por defecto (HiGHS)
dependencies = [
    "polars (>=1.39.0,<2.0.0)",
    "numpy (>=2.4.3,<3.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "highspy (>=1.14.0,<2.0.0)", # HiGHS es el estándar Open Source moderno, merece estar en core
]

# OPCIONES: El usuario instala lo que necesita
[project.optional-dependencies]
# Agrupación de solvers Open Source que requieren compilación C
solvers-oss = [
    "swiglpk (>=5.0.13,<6.0.0)",
    "pulp (>=3.3.0,<4.0.0)",
    "pyscipopt (>=6.1.0,<7.0.0)",
    "ecos (>=2.0.14,<3.0.0)",
    "osqp (>=1.1.1,<2.0.0)",
    "cvxopt (>=1.3.3,<2.0.0)", # Aviso: requiere compilador C
    "scs (>=3.2.11,<4.0.0)",
    "scipy (>=1.17.0,<2.0.0)",
]

# Solver Comercial (Separado para evitar problemas de licencia)
solvers-commercial = [
    "gurobipy (>=13.0.1,<14.0.0)",
]

# Solver NLP
solvers-nlp = [
    "casadi (>=3.7.0,<4.0.0)",
]

# Generación de Reportes y Gráficos (No necesario para CLI básica o CI headless)
reports = [
    "matplotlib (>=3.9.0,<4.0.0)",
    "fpdf2 (>=2.7.0,<3.0.0)",
]

# Interfaz Web
web = [
    "fastapi (>=0.136.0,<0.137.0)",
    "pydantic (>=2.0.0,<3.0.0)",
    "uvicorn (>=0.48.0,<0.49.0)",
    "python-multipart (>=0.0.29,<0.0.30)",
]

# Instalación completa para desarrolladores/usuarios avanzados
all = [
    "polars (>=1.39.0,<2.0.0)",
    "numpy (>=2.4.3,<3.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "highspy (>=1.14.0,<2.0.0)",
    # solvers-oss
    "swiglpk (>=5.0.13,<6.0.0)",
    "pulp (>=3.3.0,<4.0.0)",
    "pyscipopt (>=6.1.0,<7.0.0)",
    "ecos (>=2.0.14,<3.0.0)",
    "osqp (>=1.1.1,<2.0.0)",
    "cvxopt (>=1.3.3,<2.0.0)",
    "scs (>=3.2.11,<4.0.0)",
    "scipy (>=1.17.0,<2.0.0)",
    # solvers-commercial
    "gurobipy (>=13.0.1,<14.0.0)",
    # solvers-nlp
    "casadi (>=3.7.0,<4.0.0)",
    # reports
    "matplotlib (>=3.9.0,<4.0.0)",
    "fpdf2 (>=2.7.0,<3.0.0)",
    # web
    "fastapi (>=0.136.0,<0.137.0)",
    "pydantic (>=2.0.0,<3.0.0)",
    "uvicorn (>=0.48.0,<0.49.0)",
    "python-multipart (>=0.0.29,<0.0.30)",
]

# Dependencias exclusivas de desarrollo
dev = [
    "pytest (>=9.0.0,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "ruff (>=0.8.0,<1.0.0)",
    "mypy (>=2.0.0,<3.0.0)",
]

[project.scripts]
isla = "src.cli.__main__:main"

[tool.poetry]
packages = [{include = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# HERRAMIENTAS DE DESARROLLO

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__:DeprecationWarning",
    "ignore:.*ipywidgets.*:UserWarning:rich.live",
]

[dependency-groups]
dev = [
    "uvicorn (>=0.48.0,<0.49.0)",
    "python-multipart (>=0.0.29,<0.0.30)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "SIM",# flake8-simplify
>>>>>>> origin/main
]
ignore = ["E501"] # Ignorar longitud de línea porque usamos Ruff formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
