[project]
name = "isla-lp-benchmark"
version = "1.8.1"
description = "LP Benchmarking Platform - Compare multiple Linear Programming solvers"
authors = [
    {name = "Oyhs-co",email = "oyhsotelo@gmail.com"}
]
license = {text = "MIT License"}
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "gurobipy (>=13.0.1,<14.0.0)",
    "polars (>=1.39.0,<2.0.0)",
    "matplotlib (>=3.9.0,<4.0.0)",
    "numpy (>=2.4.3,<3.0.0)",
    "fpdf2 (>=2.7.0,<3.0.0)",
    "psutil (>=7.2.2,<8.0.0)",
    "highspy (>=1.14.0,<2.0.0)",
    "swiglpk (>=5.0.13,<6.0.0)",
    "pulp (>=3.3.0,<4.0.0)",
    "pyscipopt (>=6.1.0,<7.0.0)",
    "ecos (>=2.0.14,<3.0.0)",
    "osqp (>=1.1.1,<2.0.0)",
    "cvxopt (>=1.3.3,<2.0.0)",
    "scs (>=3.2.11,<4.0.0)",
    "fastapi (>=0.136.3,<0.137.0)",
    "rich (>=15.0.0,<16.0.0)",
]

[project.optional-dependencies]
ipopt = ["casadi (>=3.7.0,<4.0.0)"]
gurobi = ["gurobipy (>=13.0.1,<14.0.0)"]
all = ["gurobipy (>=13.0.1,<14.0.0)", "casadi (>=3.7.0,<4.0.0)"]
dev = ["pytest", "pytest-cov", "ruff"]

[project.scripts]
isla = "src.cli.__main__:main"

[tool.poetry]
packages = [{include = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__:DeprecationWarning",
    "ignore:.*ipywidgets.*:UserWarning:rich.live",
]

[dependency-groups]
dev = [
    "uvicorn (>=0.48.0,<0.49.0)",
    "python-multipart (>=0.0.29,<0.0.30)"
]
